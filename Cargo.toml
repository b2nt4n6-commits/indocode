[package]
name = "indocode"
version = "0.1.0"
edition = "2024"

[dependencies]
# 1. Runtime Asynchronous (Diperlukan untuk Web & DB)
tokio = { version = "1.40", features = ["full"] }

# 2. Pustaka Web Server (Ringan & Cepat)
actix-web = "4.9"

# 3. Pustaka Database (Mendukung MySQL, PostgreSQL, SQLite)
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "mysql",
    "postgres",
    "sqlite",
    "json"
] }

# 4. Pustaka Penanganan Format Data JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"